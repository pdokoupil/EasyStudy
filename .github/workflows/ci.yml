name: CI

on:
  push:
    branches: [main, "adoption/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight core + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (non-blocking for now)
        run: ruff check . || true
      - name: Import & app-boot smoke test
        working-directory: server
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (lightweight core)
        run: docker build -f server/Dockerfile -t easy-study:ci .
