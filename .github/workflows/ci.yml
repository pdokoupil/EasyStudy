name: CI

on:
  push:
    branches: [main, "adoption/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly "dependency drift" run: catches breakage from newly released deps or a new
    # Python before it bites you by hand (this is the fix for "every python upgrade is pain").
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (uv) — lightweight core + dev, resolved from uv.lock
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Lint (non-blocking for now)
        run: uv run ruff check . || true
      - name: Import & app-boot smoke test
        run: cd server && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q

  # Weekly canary: try bootstrapping on the NEWEST available Python, including pre-releases
  # (i.e. the next 3.x before it's officially out). This is the "pull latest Python and try to
  # bootstrap" check — GitHub emails you when a *scheduled* run fails (repo Settings →
  # Notifications), so a breaking Python release surfaces by email, not by hand. Only runs on
  # the weekly schedule / manual dispatch, and never blocks pushes or PRs.
  python-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"        # highest available…
          allow-prereleases: true      # …including RCs/betas of the next release
      - name: Report Python version
        run: python --version
      - name: Install core + dev on the newest Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import & app-boot smoke test
        working-directory: server
        run: pytest -q

  # Lockfile check: fail if uv.lock is stale (someone changed pyproject deps without
  # re-running `uv lock`), then install exactly from the frozen lock and smoke-test it.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv.lock is up to date with pyproject
        run: uv lock --check
      - name: Install from the frozen lock + dev, and smoke-test
        run: |
          uv sync --frozen --extra dev
          cd server && "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image (lightweight core)
        run: docker build -f server/Dockerfile -t easy-study:ci .

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build docs (strict)
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict

  # Validate the package builds and its metadata renders (prerequisite for PyPI publishing).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
