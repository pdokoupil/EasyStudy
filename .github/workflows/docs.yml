name: docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: write   # to push to the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mkdocs-material
      # Publishes the built site to the gh-pages branch. Enable Pages
      # (Settings -> Pages -> source: gh-pages) once, then this keeps it updated.
      - run: mkdocs gh-deploy --force
