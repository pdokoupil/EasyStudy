site_name: EasyStudy
site_description: >-
  EasyStudy is an open-source, plugin-based framework for deploying customizable user studies on
  recommender systems (and beyond). Create A/B comparisons of recommendation algorithms in a few
  clicks, or extend it via Python plugins for any item-based interactive experiment — HCI,
  information retrieval, data visualization, and social science research.
site_url: https://pdokoupil.github.io/EasyStudy/
repo_url: https://github.com/pdokoupil/EasyStudy
repo_name: pdokoupil/EasyStudy
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [server]   # so `plugins.fastcompare.algo.algorithm_base` resolves
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false
            heading_level: 3

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Gallery: gallery.md
  - Publications: publications.md
  - Getting started:
      - Quickstart (15 min): quickstart.md
      - Concepts: concepts.md
      - Live demo & hosted instance: live-demo.md
  - Guides:
      - Create a study (no code): create-a-study.md
      - Extending fastcompare: extending.md
      - Write your first plugin: first-plugin.md
      - Testing your components: testing-components.md
      - Data model & exporting results: data-model.md
  - Reference:
      - Base classes (API): api.md
  - Operations:
      - Deployment: deployment.md
      - Troubleshooting: troubleshooting.md
