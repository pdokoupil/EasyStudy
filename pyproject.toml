# EasyStudy packaging & dependency source of truth.
#
# Dependency philosophy: the CORE install is deliberately LIGHTWEIGHT (pure-Python
# Flask stack + pandas/numpy/scikit-learn). Heavy / optional backends live behind
# extras so nobody installs TensorFlow just to run a books-vs-movies study.
#
#   pip install easystudy                 # lightweight core (this is the default)
#   pip install "easystudy[tensorflow]"   # TensorFlow + TF-Recommenders algorithms (VAE, TFRS)
#   pip install "easystudy[lenskit]"      # LensKit baseline wrappers
#   pip install "easystudy[redis]"        # Redis-backed sessions/queue
#   pip install "easystudy[discogs]"      # Discogs metadata client (music domain)
#   pip install "easystudy[all]"          # everything
#   pip install "easystudy[dev]"          # tests + linters + load testing
#
# Package layout: `easystudy` (src/easystudy) is a thin CLI; the actual Flask app/plugins
# (server/) and helper scripts (scripts/) are vendored verbatim as `easystudy._vendor_server`
# / `easystudy._vendor_scripts` and put on sys.path at runtime — see
# src/easystudy/_bootstrap.py for why (their ~40 files use flat, CWD-relative imports that
# predate this packaging). `easystudy serve` / `fetch-data` / `create-user` are the CLI.
# This file is also the single, authoritative dependency manifest, replacing the old split
# conda_requirements.txt / pip_requirements.txt.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easystudy"
version = "1.0.0"
description = "A modular framework for quick & easy deployment of customizable user studies — for recommender systems and any other item-based interactive system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Patrik Dokoupil", email = "patrik.dokoupil@matfyz.cuni.cz" },
    { name = "Ladislav Peska", email = "ladislav.peska@matfyz.cuni.cz" },
]
keywords = ["user studies", "recommender systems", "evaluation", "user-centric", "hci", "surveys"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

# --- CORE (lightweight) dependencies -----------------------------------------
dependencies = [
    "Flask>=3.0",
    "Werkzeug>=3.0",
    "Flask-Login",
    "Flask-SQLAlchemy",
    "Flask-Migrate",
    "Flask-Session",
    "Flask-WTF",
    "Flask-PluginKit",
    "bcrypt",
    "is-safe-url",
    "pandas",
    "numpy",
    "scikit-learn",
    "scipy",
    "Pillow",
    "gunicorn",
    "cachelib",
    "cachetools",
    "tqdm",
    "requests",
    "beautifulsoup4",
    # imdbinfo powers MovieLens cover images at runtime. It's in the core (not an extra)
    # because item posters are central to the RS study experience — without it the demo
    # shows no images. It replaces cinemagoer, whose IMDb parsing was removed in April 2026.
    "imdbinfo",
    # Python 3.13 removed the stdlib `cgi` module, which Flask-PluginKit still imports.
    # legacy-cgi backports it so the app runs on 3.13/3.14.
    "legacy-cgi; python_version >= '3.13'",
    # Flask-PluginKit shells out to `pip list` at startup to enumerate plugins, so pip must
    # be present in the runtime environment. pip ships with pip-based installs but NOT with
    # uv-managed venvs, so declare it explicitly.
    "pip",
]

[project.optional-dependencies]
# VAE/RBM plugin backend: TensorFlow + TF-Recommenders + Microsoft `recommenders`.
tensorflow = ["tensorflow>=2.15", "tensorflow-recommenders>=0.7.3", "recommenders"]
lenskit = ["lenskit"]
# PyTorch + RecBole backend (better-maintained than TF-Recommenders). Enables the `recbole`
# plugin's algorithms (BPR, LightGCN, NeuMF, …). See server/plugins/recbole/.
torch = ["torch", "recbole"]
recbole = ["torch", "recbole"]  # alias for `torch`
redis = ["redis"]
discogs = ["python3-discogs-client"]
# Back-compat alias: imdbinfo is now a core dependency (see above), so this extra is a no-op.
imdb = ["imdbinfo"]
# convenience aggregate
all = [
    "tensorflow>=2.15",
    "tensorflow-recommenders>=0.7.3",
    "recommenders",
    "lenskit",
    "torch",
    "recbole",
    "redis",
    "python3-discogs-client",
    "imdbinfo",
]
dev = ["pytest", "ruff", "black", "locust"]
docs = ["mkdocs-material>=9,<10", "mkdocs", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/pdokoupil/EasyStudy"
Repository = "https://github.com/pdokoupil/EasyStudy"
Paper = "https://doi.org/10.1145/3604915.3610640"

[project.scripts]
easystudy = "easystudy.cli:main"

# Package layout: `easystudy` lives under src/; the Flask app (server/) and helper
# scripts (scripts/) are vendored verbatim as separate mapped packages (see the note
# above and src/easystudy/_bootstrap.py). Not zip-safe: Flask apps need real files on
# disk for templates/static.
[tool.setuptools]
zip-safe = false
packages = [
    "easystudy",
    "easystudy._vendor_server",
    "easystudy._vendor_server.plugins",
    "easystudy._vendor_server.plugins.empty_template",
    "easystudy._vendor_server.plugins.fastcompare",
    "easystudy._vendor_server.plugins.fastcompare.algo",
    "easystudy._vendor_server.plugins.fastcompare.algo.wrappers",
    "easystudy._vendor_server.plugins.fastcompare.tests",
    "easystudy._vendor_server.plugins.layoutshuffling",
    "easystudy._vendor_server.plugins.recbole",
    "easystudy._vendor_server.plugins.utils",
    "easystudy._vendor_server.plugins.vae",
    "easystudy._vendor_scripts",
]

[tool.setuptools.package-dir]
"" = "src"
"easystudy._vendor_server" = "server"
"easystudy._vendor_scripts" = "scripts"

# Explicit (not "static/**/*") on purpose: server/static/datasets/ is runtime-fetched data
# (CSVs/images), never something to bundle into the wheel.
[tool.setuptools.package-data]
"easystudy._vendor_server" = [
    "templates/**/*",
    "static/*.js", "static/*.js.map", "static/*.css", "static/*.css.map", "static/*.svg",
    "static/languages/**/*",
    "static/tinymce/**/*",
    "*.json",
    "migrations/*",
    "migrations/versions/*",
]
"easystudy._vendor_server.plugins.utils" = [
    "static/**/*", "templates/**/*",
    # PEP 420 namespace packages (no __init__.py) that plugins/utils/preference_elicitation.py
    # imports as top-level names via its own sys.path.append(dirname(__file__)) — these aren't
    # discovered by the explicit `packages` list above (which only covers real packages), so
    # they must be listed as data or they silently go missing from the wheel.
    "support/*.py", "normalization/*.py", "mandate_allocation/*.py",
]
"easystudy._vendor_server.plugins.fastcompare" = ["static/**/*", "templates/**/*"]
"easystudy._vendor_server.plugins.layoutshuffling" = ["static/**/*", "templates/**/*"]
"easystudy._vendor_server.plugins.empty_template" = ["templates/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
